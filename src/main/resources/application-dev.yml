spring:
  # 阿里云百炼 AI 配置
  ai:
    dashscope:
      # 需要替换为你自己的 key
      api-key: sk-16c3d623ea964836ae1b4ff1f1138c1e
      chat:
        options:
          model: qwen-vl-plus  # 使用视觉模型支持图片理解，也可使用 qwen3-vl-plus
          temperature: 0.7
      image:
        options:
          # 支持多个模型，按优先级顺序尝试，当某个模型额度不足或失败时自动切换到下一个
          models: qwen-image-plus,qwen-image-max
          # 默认模型（兼容旧配置）
          model: qwen-image-plus
          size: 1280*1280  # 支持的尺寸：1024*1024, 720*1280, 1280*720, 1280*1280

# 文件存储配置
file:
  upload-dir: output
  base-url: http://localhost:8443