<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI表情盒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .preview-area {
            margin-top: 20px;
            display: none;
        }

        .preview-area.active {
            display: block;
        }

        .preview-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-area {
            margin-top: 30px;
            display: none;
        }

        .result-area.active {
            display: block;
        }

        .result-title {
            color: #333;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-image {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 14px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .file-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .emotion-selector {
            margin: 20px 0;
        }

        .emotion-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .emotion-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .emotion-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .emotion-btn:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
        }

        .emotion-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .text-input-area {
            margin: 20px 0;
        }

        .text-input-label {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .text-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .text-input-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .footer-info {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 12px;
            line-height: 1.6;
        }

        .footer-info p {
            margin: 4px 0;
        }

        .style-section {
            margin: 20px 0;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            background: #f9f9f9;
        }

        .style-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .style-section-title::after {
            content: '▼';
            font-size: 12px;
            transition: transform 0.3s;
        }

        .style-section.collapsed .style-section-title::after {
            transform: rotate(-90deg);
        }

        .style-section-content {
            display: block;
        }

        .style-section.collapsed .style-section-content {
            display: none;
        }

        .style-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .style-label {
            font-size: 13px;
            color: #666;
            min-width: 80px;
        }

        .style-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }

        .style-select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .style-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .style-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .style-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .style-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .color-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-preview {
            width: 40px;
            height: 30px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .color-input {
            width: 100px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }

        /* 图库相关样式 */
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .gallery-search {
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .search-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .category-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .category-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f9f9f9;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .gallery-item.selected {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .gallery-empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .load-more-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #f0f0f0;
            color: #666;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .load-more-btn:hover {
            background: #e0e0e0;
        }

        /* 黑话盒子样式 */
        .slang-box {
            padding: 20px;
        }

        .slang-header {
            margin-bottom: 30px;
        }

        .slang-input-area {
            margin-bottom: 30px;
        }

        .slang-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .slang-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .slang-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .slang-search-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .slang-search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .slang-search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .slang-refresh-btn {
            padding: 12px 20px;
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
        }

        .slang-refresh-btn:hover {
            background: #e8ebff;
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.3);
        }

        .slang-refresh-btn:active {
            transform: translateY(0);
        }

        .slang-refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .slang-refresh-btn.loading span {
            animation: spin 1s linear infinite;
        }

        .slang-examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .slang-examples-label {
            font-size: 13px;
            color: #999;
            margin-right: 5px;
        }

        .slang-example-tag {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }

        .slang-example-tag:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .slang-result {
            background: #f8f9ff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .slang-word {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .slang-short-explanation {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            font-weight: 500;
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .slang-toggle {
            text-align: center;
            margin: 15px 0;
        }

        .slang-toggle-btn {
            padding: 8px 20px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 13px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        .slang-toggle-btn:hover {
            background: #e0e0e0;
            border-color: #667eea;
        }

        .slang-detailed-explanation {
            font-size: 14px;
            line-height: 1.8;
            color: #666;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-top: 10px;
        }

        .slang-loading-text {
            font-size: 13px;
            color: #999;
        }

        .slang-loading {
            text-align: center;
            padding: 40px;
        }

        .slang-loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 AI表情盒子</h1>
        <p class="subtitle">AI生成表情包、头像，智能解释网络黑话</p>

        <!-- 标签页切换 -->
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="upload">📤 上传图片</button>
            <button class="tab-btn" data-tab="gallery">🖼️ 图库选择</button>
            <button class="tab-btn" data-tab="slang">💬 黑话盒子</button>
        </div>

        <!-- 上传图片标签页 -->
        <div class="tab-content active" id="uploadTab">
            <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">点击或拖拽图片到这里</div>
            <div class="upload-hint">支持 JPG、PNG 格式，最大 10MB</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png">
        </div>

        <div class="preview-area" id="previewArea">
            <img id="previewImage" class="preview-image" alt="预览图片">
            <div class="file-info" id="fileInfo"></div>
            
            <!-- 图片风格选择 -->
            <div class="style-section" id="styleSection">
                <div class="style-section-title" onclick="toggleSection('styleSection')">
                    图片风格
                </div>
                <div class="style-section-content">
                    <div class="style-buttons">
                        <button class="style-btn active" data-style="original">原样</button>
                        <button class="style-btn" data-style="cartoon">卡通风</button>
                        <button class="style-btn" data-style="pixel">像素风</button>
                        <button class="style-btn" data-style="tough">硬汉风</button>
                        <button class="style-btn" data-style="realistic">写实风</button>
                    </div>
                </div>
            </div>
            
            <div class="emotion-selector" id="emotionSelector">
                <div class="emotion-label">选择情绪：</div>
                <div class="emotion-buttons">
                    <button class="emotion-btn active" data-emotion="happy">😊 高兴</button>
                    <button class="emotion-btn" data-emotion="sad">😢 伤心</button>
                    <button class="emotion-btn" data-emotion="angry">😠 生气</button>
                    <button class="emotion-btn" data-emotion="surprised">😲 惊讶</button>
                    <button class="emotion-btn" data-emotion="confused">😕 困惑</button>
                    <button class="emotion-btn" data-emotion="excited">🤩 兴奋</button>
                    <button class="emotion-btn" data-emotion="calm">😌 平静</button>
                    <button class="emotion-btn" data-emotion="shy">😳 害羞</button>
                    <button class="emotion-btn" data-emotion="playful">😜 调皮</button>
                </div>
            </div>

            <div class="text-input-area">
                <div class="text-input-label">自定义文字（可选）：</div>
                <input 
                    type="text" 
                    id="customText" 
                    class="text-input" 
                    placeholder="输入你想添加到图片上的文字，留空则不添加文字"
                    maxlength="50"
                >
                <div class="text-input-hint">文字将显示在图片中间，支持自动换行</div>
            </div>

            <!-- 文字样式设置 -->
            <div class="style-section" id="textStyleSection">
                <div class="style-section-title" onclick="toggleSection('textStyleSection')">
                    文字样式设置
                </div>
                <div class="style-section-content">
                    <div class="style-row">
                        <label class="style-label">文字位置：</label>
                        <select id="textPosition" class="style-select">
                            <option value="center">中间</option>
                            <option value="top">顶部</option>
                            <option value="bottom">底部</option>
                        </select>
                    </div>
                    <div class="style-row">
                        <label class="style-label">字体大小：</label>
                        <input type="number" id="fontSize" class="style-input" value="40" min="20" max="100">
                    </div>
                    <div class="style-row">
                        <label class="style-label">文字颜色：</label>
                        <div class="color-input-wrapper">
                            <div class="color-preview" id="textColorPreview" style="background: rgb(255,255,255)" onclick="document.getElementById('textColor').click()"></div>
                            <input type="color" id="textColor" class="color-input" value="#ffffff" style="display:none">
                            <input type="text" id="textColorRgb" class="style-input" value="255,255,255" placeholder="RGB格式，如：255,255,255">
                        </div>
                    </div>
                    <div class="style-row">
                        <label class="style-label">描边颜色：</label>
                        <div class="color-input-wrapper">
                            <div class="color-preview" id="strokeColorPreview" style="background: rgb(0,0,0)" onclick="document.getElementById('strokeColor').click()"></div>
                            <input type="color" id="strokeColor" class="color-input" value="#000000" style="display:none">
                            <input type="text" id="strokeColorRgb" class="style-input" value="0,0,0" placeholder="RGB格式，如：0,0,0">
                        </div>
                    </div>
                    <div class="style-row">
                        <label class="style-label">描边宽度：</label>
                        <input type="number" id="strokeWidth" class="style-input" value="3" min="1" max="10">
                    </div>
                </div>
            </div>

            <!-- 滤镜选择 -->
            <div class="style-section" id="filterSection">
                <div class="style-section-title" onclick="toggleSection('filterSection')">
                    滤镜效果
                </div>
                <div class="style-section-content">
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="none">无滤镜</button>
                        <button class="filter-btn" data-filter="grayscale">黑白</button>
                        <button class="filter-btn" data-filter="vintage">复古</button>
                        <button class="filter-btn" data-filter="bright">明亮</button>
                        <button class="filter-btn" data-filter="dark">暗调</button>
                        <button class="filter-btn" data-filter="warm">暖色</button>
                        <button class="filter-btn" data-filter="cool">冷色</button>
                        <button class="filter-btn" data-filter="sepia">怀旧</button>
                        <button class="filter-btn" data-filter="contrast">高对比</button>
                        <button class="filter-btn" data-filter="saturate">高饱和</button>
                    </div>
                </div>
            </div>
            
            <button class="btn" id="generateBtn">生成情绪表情</button>
        </div>
        </div>

        <!-- 图库选择标签页 -->
        <div class="tab-content" id="galleryTab">
            <div class="gallery-search">
                <div class="search-input-wrapper">
                    <input type="text" id="gallerySearchInput" class="search-input" placeholder="搜索图片（如：猫、风景、人物）">
                    <button class="search-btn" id="gallerySearchBtn">搜索</button>
                </div>
                <div class="category-buttons">
                    <button class="category-btn active" data-category="">全部</button>
                    <button class="category-btn" data-category="beauty">靓女</button>
                    <button class="category-btn" data-category="anime">动漫</button>
                    <button class="category-btn" data-category="cartoon">卡通</button>
                    <button class="category-btn" data-category="kawaii">二次元</button>
                    <button class="category-btn" data-category="cute">可爱</button>
                    <button class="category-btn" data-category="emotion">表情</button>
                    <button class="category-btn" data-category="animals">动物</button>
                    <button class="category-btn" data-category="nature">自然</button>
                    <button class="category-btn" data-category="people">人物</button>
                    <button class="category-btn" data-category="food">食物</button>
                    <button class="category-btn" data-category="funny">搞笑</button>
                </div>
            </div>
            <div class="gallery-grid" id="galleryGrid">
                <div class="gallery-loading">加载中...</div>
            </div>
            <button class="load-more-btn" id="loadMoreBtn" style="display: none;">加载更多</button>
        </div>

        <!-- 黑话盒子标签页 -->
        <div class="tab-content" id="slangTab">
            <div class="slang-box">
                <div class="slang-header">
                    <h3 style="margin-bottom: 10px; color: #333;">💬 黑话盒子</h3>
                    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">输入互联网黑话或网络用语，AI 帮你解释含义、来源和使用场景</p>
                </div>
                <div class="slang-input-area">
                    <div class="slang-input-wrapper">
                        <input 
                            type="text" 
                            id="slangInput" 
                            class="slang-input" 
                            placeholder="输入词语，如：yyds、破防、内卷、社死..."
                            maxlength="50"
                        >
                        <button class="slang-search-btn" id="slangSearchBtn">解释</button>
                        <button class="slang-refresh-btn" id="slangRefreshBtn" title="刷新热门词语">
                            <span>↻</span>
                        </button>
                    </div>
                    <div class="slang-examples-wrapper">
                        <div class="slang-examples-header">
                            <span class="slang-examples-label">热门词语：</span>
                        </div>
                        <div class="slang-examples" id="slangExamples">
                            <span class="slang-loading-text" id="slangLoadingText">加载中...</span>
                        </div>
                    </div>
                </div>
                <div class="slang-result" id="slangResult" style="display: none;">
                    <div class="slang-word" id="slangWord"></div>
                    <div class="slang-short-explanation" id="slangShortExplanation"></div>
                    <div class="slang-toggle" id="slangToggle" style="display: none;">
                        <button class="slang-toggle-btn" id="slangToggleBtn">查看详细说明 ▼</button>
                    </div>
                    <div class="slang-detailed-explanation" id="slangDetailedExplanation" style="display: none;"></div>
                </div>
                <div class="slang-loading" id="slangLoading" style="display: none;">
                    <div class="spinner"></div>
                    <div class="loading-text">AI 正在分析中...</div>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">AI 正在生成情绪表情图片...</div>
        </div>

        <div class="error" id="error"></div>

        <div class="result-area" id="resultArea">
            <div class="result-title">✨ 生成完成！</div>
            <img id="resultImage" class="result-image" alt="生成的表情包">
            <button class="btn" onclick="downloadImage()">下载表情包</button>
            <button class="btn" onclick="resetForm()" style="background: #999; margin-top: 10px;">重新生成</button>
        </div>
        
        <!-- 作者信息 -->
        <div class="footer-info">
            <p>作者：芝麻丸</p>
            <p>联系方式：15625735770</p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');
        const fileInfo = document.getElementById('fileInfo');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultArea = document.getElementById('resultArea');
        const resultImage = document.getElementById('resultImage');

        const customTextInput = document.getElementById('customText');
        let selectedFile = null;
        let resultImageUrl = null;
        let selectedEmotion = 'happy';
        let selectedFilter = 'none';
        let selectedStyle = 'original';

        // 图库相关变量
        const galleryGrid = document.getElementById('galleryGrid');
        const gallerySearchInput = document.getElementById('gallerySearchInput');
        const gallerySearchBtn = document.getElementById('gallerySearchBtn');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        let currentGalleryPage = 1;
        let currentGalleryQuery = '';
        let currentGalleryCategory = '';
        let selectedGalleryImage = null;
        let galleryImages = [];

        // 标签页切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                
                // 更新按钮状态
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // 更新内容区域
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(tab + 'Tab').classList.add('active');
                
                // 如果是图库标签页，加载默认图片
                if (tab === 'gallery' && galleryImages.length === 0) {
                    loadGalleryImages('', 1, '');
                }
                // 如果是黑话盒子标签页，确保热门词语已加载
                if (tab === 'slang') {
                    const examplesContainer = document.getElementById('slangExamples');
                    const existingTags = examplesContainer.querySelectorAll('.slang-example-tag');
                    if (existingTags.length === 0) {
                        loadHotSlangs();
                    }
                }
            });
        });

        // 图库搜索
        gallerySearchBtn.addEventListener('click', () => {
            const query = gallerySearchInput.value.trim();
            currentGalleryQuery = query;
            currentGalleryCategory = '';
            currentGalleryPage = 1;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.category-btn[data-category=""]').classList.add('active');
            loadGalleryImages(query, 1, '');
        });

        gallerySearchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                gallerySearchBtn.click();
            }
        });

        // 分类选择
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const category = btn.dataset.category;
                currentGalleryCategory = category;
                currentGalleryQuery = '';
                currentGalleryPage = 1;
                gallerySearchInput.value = '';
                
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                if (category) {
                    loadGalleryImages('', 1, category);
                } else {
                    loadGalleryImages('', 1, '');
                }
            });
        });

        // 加载图库图片
        async function loadGalleryImages(query, page, category) {
            galleryGrid.innerHTML = '<div class="gallery-loading">加载中...</div>';
            
            try {
                let url;
                if (category) {
                    url = `/api/meme/gallery/category?category=${encodeURIComponent(category)}&page=${page}`;
                } else if (query) {
                    url = `/api/meme/gallery/search?query=${encodeURIComponent(query)}&page=${page}&perPage=15`;
                } else {
                    url = `/api/meme/gallery/curated?page=${page}&perPage=15`;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.images && data.images.length > 0) {
                    if (page === 1) {
                        galleryImages = data.images;
                    } else {
                        galleryImages = galleryImages.concat(data.images);
                    }
                    renderGallery();
                    loadMoreBtn.style.display = galleryImages.length >= 15 ? 'block' : 'none';
                } else {
                    galleryGrid.innerHTML = '<div class="gallery-empty">暂无图片，请尝试其他搜索词或分类</div>';
                    loadMoreBtn.style.display = 'none';
                }
            } catch (error) {
                console.error('加载图库失败:', error);
                galleryGrid.innerHTML = '<div class="gallery-empty">加载失败，请稍后重试</div>';
                loadMoreBtn.style.display = 'none';
            }
        }

        // 渲染图库网格
        function renderGallery() {
            if (galleryImages.length === 0) {
                galleryGrid.innerHTML = '<div class="gallery-empty">暂无图片</div>';
                return;
            }
            
            galleryGrid.innerHTML = galleryImages.map((img, index) => `
                <div class="gallery-item ${selectedGalleryImage === img.originalUrl ? 'selected' : ''}" 
                     data-url="${img.originalUrl}" 
                     data-index="${index}">
                    <img src="${img.smallUrl || img.mediumUrl || img.originalUrl}" 
                         alt="Gallery Image ${index + 1}" 
                         loading="lazy">
                </div>
            `).join('');
            
            // 添加点击事件
            galleryGrid.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', () => {
                    const url = item.dataset.url;
                    selectedGalleryImage = url;
                    
                    // 更新选中状态
                    galleryGrid.querySelectorAll('.gallery-item').forEach(i => {
                        i.classList.remove('selected');
                    });
                    item.classList.add('selected');
                    
                    // 设置预览图片（不直接生成，让用户设置参数后点击生成按钮）
                    selectedFile = null; // 清除上传的文件
                    previewImage.src = url;
                    previewArea.classList.add('active');
                    fileInfo.textContent = `图库图片 | URL: ${url.substring(0, 30)}...`;
                    
                    // 切换到上传标签页，让用户设置情绪、文字、样式、滤镜
                    document.querySelector('.tab-btn[data-tab="upload"]').click();
                    
                    hideError();
                });
            });
        }


        // 加载更多
        loadMoreBtn.addEventListener('click', () => {
            currentGalleryPage++;
            if (currentGalleryCategory) {
                loadGalleryImages('', currentGalleryPage, currentGalleryCategory);
            } else if (currentGalleryQuery) {
                loadGalleryImages(currentGalleryQuery, currentGalleryPage, '');
            } else {
                loadGalleryImages('', currentGalleryPage, '');
            }
        });

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 处理文件
        function handleFile(file) {
            if (!file) return;

            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showError('请选择图片文件（JPG 或 PNG）');
                return;
            }

            // 验证文件大小（10MB）
            if (file.size > 10 * 1024 * 1024) {
                showError('图片大小不能超过 10MB');
                return;
            }

            selectedFile = file;
            hideError();

            // 显示预览
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewArea.classList.add('active');
                fileInfo.textContent = `文件名: ${file.name} | 大小: ${(file.size / 1024).toFixed(2)} KB`;
            };
            reader.readAsDataURL(file);
        }

        // 情绪选择按钮事件
        document.querySelectorAll('.emotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedEmotion = btn.getAttribute('data-emotion');
            });
        });

        // 滤镜选择按钮事件
        // 风格选择
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedStyle = btn.getAttribute('data-style');
            });
        });

        // 滤镜选择
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedFilter = btn.getAttribute('data-filter');
            });
        });

        // 颜色选择器事件
        document.getElementById('textColor').addEventListener('change', (e) => {
            const color = e.target.value;
            const rgb = hexToRgb(color);
            document.getElementById('textColorRgb').value = rgb;
            document.getElementById('textColorPreview').style.background = `rgb(${rgb})`;
        });

        document.getElementById('textColorRgb').addEventListener('input', (e) => {
            const rgb = e.target.value;
            if (/^\d+,\d+,\d+$/.test(rgb)) {
                const [r, g, b] = rgb.split(',').map(Number);
                document.getElementById('textColorPreview').style.background = `rgb(${r},${g},${b})`;
            }
        });

        document.getElementById('strokeColor').addEventListener('change', (e) => {
            const color = e.target.value;
            const rgb = hexToRgb(color);
            document.getElementById('strokeColorRgb').value = rgb;
            document.getElementById('strokeColorPreview').style.background = `rgb(${rgb})`;
        });

        document.getElementById('strokeColorRgb').addEventListener('input', (e) => {
            const rgb = e.target.value;
            if (/^\d+,\d+,\d+$/.test(rgb)) {
                const [r, g, b] = rgb.split(',').map(Number);
                document.getElementById('strokeColorPreview').style.background = `rgb(${r},${g},${b})`;
            }
        });

        // 生成情绪表情
        generateBtn.addEventListener('click', async () => {
            // 检查是否有图片（上传的或图库的）
            if (!selectedFile && !selectedGalleryImage) {
                showError('请先选择图片或从图库选择');
                return;
            }

            // 显示加载状态
            loading.classList.add('active');
            resultArea.classList.remove('active');
            hideError();
            generateBtn.disabled = true;

            // 创建 FormData（统一处理上传图片和图库图片）
            const formData = new FormData();
            formData.append('emotion', selectedEmotion);
            
            // 如果输入了自定义文字，添加到请求中
            const customText = customTextInput.value.trim();
            if (customText) {
                formData.append('text', customText);
                
                // 构建文字样式JSON
                const textStyle = {
                    textColor: document.getElementById('textColorRgb').value,
                    strokeColor: document.getElementById('strokeColorRgb').value,
                    strokeWidth: parseInt(document.getElementById('strokeWidth').value),
                    fontSize: parseInt(document.getElementById('fontSize').value),
                    position: document.getElementById('textPosition').value,
                    fontName: 'SimHei',
                    opacity: 1.0,
                    rotation: 0,
                    enableShadow: false
                };
                formData.append('textStyle', JSON.stringify(textStyle));
            }
            
            // 添加风格参数
            if (selectedStyle && selectedStyle !== 'original') {
                formData.append('style', selectedStyle);
            }
            
            // 添加滤镜参数
            if (selectedFilter && selectedFilter !== 'none') {
                formData.append('filter', selectedFilter);
            }

            try {
                let response;
                
                // 判断是图库图片还是上传图片
                if (selectedGalleryImage && !selectedFile) {
                    // 图库图片：使用 generate-from-gallery 接口
                    formData.append('imageUrl', selectedGalleryImage);
                    response = await fetch('/api/meme/generate-from-gallery', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // 上传图片：使用 generate 接口
                    formData.append('image', selectedFile);
                    response = await fetch('/api/meme/generate', {
                        method: 'POST',
                        body: formData
                    });
                }

                const data = await response.json();

                if (data.success) {
                    // 显示结果
                    resultImageUrl = data.imageUrl;
                    resultImage.src = data.imageUrl;
                    resultArea.classList.add('active');
                    document.querySelector('.result-title').textContent = `✨ ${data.emotion}表情生成完成！`;
                } else {
                    showError(data.message || '生成失败，请重试');
                }
            } catch (err) {
                showError('网络错误：' + err.message);
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        });

        // 下载图片
        function downloadImage() {
            if (!resultImageUrl) return;

            const link = document.createElement('a');
            link.href = resultImageUrl;
            link.download = 'meme_' + Date.now() + '.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 重置表单
        function resetForm() {
            selectedFile = null;
            selectedGalleryImage = null;
            resultImageUrl = null;
            previewArea.classList.remove('active');
            resultArea.classList.remove('active');
            fileInput.value = '';
            customTextInput.value = '';
            // 清除图库选中状态
            galleryGrid.querySelectorAll('.gallery-item').forEach(i => {
                i.classList.remove('selected');
            });
            hideError();
        }

        // 显示错误
        function showError(message) {
            error.textContent = message;
            error.classList.add('active');
        }

        // 隐藏错误
        function hideError() {
            error.classList.remove('active');
        }

        // 切换折叠区域
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            section.classList.toggle('collapsed');
        }

        // 十六进制转RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            if (result) {
                return `${parseInt(result[1], 16)},${parseInt(result[2], 16)},${parseInt(result[3], 16)}`;
            }
            return '255,255,255';
        }

        // 黑话盒子相关变量
        const slangInput = document.getElementById('slangInput');
        const slangSearchBtn = document.getElementById('slangSearchBtn');
        const slangResult = document.getElementById('slangResult');
        const slangWord = document.getElementById('slangWord');
        const slangExplanation = document.getElementById('slangExplanation');
        const slangLoading = document.getElementById('slangLoading');
        const slangRefreshBtn = document.getElementById('slangRefreshBtn');

        // 黑话盒子搜索
        slangSearchBtn.addEventListener('click', explainSlang);
        slangInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                explainSlang();
            }
        });

        // 加载热门词语
        async function loadHotSlangs() {
            try {
                const response = await fetch('/api/meme/slang/hot-words');
                const data = await response.json();
                
                const examplesContainer = document.getElementById('slangExamples');
                const loadingText = examplesContainer.querySelector('.slang-loading-text');
                
                if (data.success && data.hotSlangs && data.hotSlangs.length > 0) {
                    // 移除加载文本
                    if (loadingText) {
                        loadingText.remove();
                    }
                    
                    // 清空现有标签（保留标签）
                    const label = examplesContainer.querySelector('.slang-examples-label');
                    const existingTags = examplesContainer.querySelectorAll('.slang-example-tag');
                    existingTags.forEach(tag => tag.remove());
                    
                    // 添加新的热门词语标签
                    data.hotSlangs.forEach(word => {
                        const tag = document.createElement('span');
                        tag.className = 'slang-example-tag';
                        tag.textContent = word;
                        tag.dataset.word = word;
                        tag.addEventListener('click', () => {
                            slangInput.value = word;
                            explainSlang();
                        });
                        examplesContainer.appendChild(tag);
                    });
                } else {
                    // 如果API失败，使用默认词语
                    if (loadingText) {
                        loadingText.remove();
                    }
                    const defaultWords = ['yyds', '破防', '内卷', '社死', 'emo', '摆烂', '躺平', '打工人'];
                    defaultWords.forEach(word => {
                        const tag = document.createElement('span');
                        tag.className = 'slang-example-tag';
                        tag.textContent = word;
                        tag.dataset.word = word;
                        tag.addEventListener('click', () => {
                            slangInput.value = word;
                            explainSlang();
                        });
                        examplesContainer.appendChild(tag);
                    });
                }
            } catch (err) {
                console.error('加载热门词语失败:', err);
                // 使用默认词语
                const examplesContainer = document.getElementById('slangExamples');
                const loadingText = examplesContainer.querySelector('.slang-loading-text');
                if (loadingText) {
                    loadingText.remove();
                }
                const defaultWords = ['yyds', '破防', '内卷', '社死', 'emo', '摆烂', '躺平', '打工人'];
                defaultWords.forEach(word => {
                    const tag = document.createElement('span');
                    tag.className = 'slang-example-tag';
                    tag.textContent = word;
                    tag.dataset.word = word;
                    tag.addEventListener('click', () => {
                        slangInput.value = word;
                        explainSlang();
                    });
                    examplesContainer.appendChild(tag);
                });
            }
        }

        // 页面加载时获取热门词语
        loadHotSlangs();

        // 刷新热门词语按钮
        slangRefreshBtn.addEventListener('click', refreshHotSlangs);

        // 热门词语点击（动态绑定）
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('slang-example-tag')) {
                const word = e.target.dataset.word;
                slangInput.value = word;
                explainSlang();
            }
        });

        // 解释黑话
        async function explainSlang() {
            const word = slangInput.value.trim();
            
            if (!word) {
                showError('请输入需要解释的词语');
                return;
            }

            // 显示加载状态
            slangLoading.style.display = 'block';
            slangResult.style.display = 'none';
            slangSearchBtn.disabled = true;
            hideError();

            try {
                const response = await fetch(`/api/meme/slang/explain?word=${encodeURIComponent(word)}`);
                const data = await response.json();

                if (data.success) {
                    slangWord.textContent = data.word;
                    document.getElementById('slangShortExplanation').textContent = data.shortExplanation || '暂无简短解释';
                    
                    // 如果有详细说明，显示展开按钮
                    const detailedExplanation = document.getElementById('slangDetailedExplanation');
                    const toggleBtn = document.getElementById('slangToggleBtn');
                    const toggleDiv = document.getElementById('slangToggle');
                    
                    if (data.detailedExplanation && data.detailedExplanation.trim()) {
                        detailedExplanation.textContent = data.detailedExplanation;
                        toggleDiv.style.display = 'block';
                        detailedExplanation.style.display = 'none';
                        toggleBtn.textContent = '查看详细说明 ▼';
                    } else {
                        toggleDiv.style.display = 'none';
                    }
                    
                    slangResult.style.display = 'block';
                } else {
                    showError(data.message || '解释失败，请重试');
                }
            } catch (err) {
                showError('网络错误：' + err.message);
            } finally {
                slangLoading.style.display = 'none';
                slangSearchBtn.disabled = false;
            }
        }

        // 切换详细说明显示
        document.getElementById('slangToggleBtn').addEventListener('click', () => {
            const detailedExplanation = document.getElementById('slangDetailedExplanation');
            const toggleBtn = document.getElementById('slangToggleBtn');
            
            if (detailedExplanation.style.display === 'none') {
                detailedExplanation.style.display = 'block';
                toggleBtn.textContent = '收起详细说明 ▲';
            } else {
                detailedExplanation.style.display = 'none';
                toggleBtn.textContent = '查看详细说明 ▼';
            }
        });

        // 刷新热门词语
        async function refreshHotSlangs() {
            slangRefreshBtn.classList.add('loading');
            slangRefreshBtn.disabled = true;
            
            try {
                const response = await fetch('/api/meme/slang/hot-words/refresh', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success && data.hotSlangs && data.hotSlangs.length > 0) {
                    const examplesContainer = document.getElementById('slangExamples');
                    const loadingText = examplesContainer.querySelector('.slang-loading-text');
                    
                    // 移除加载文本
                    if (loadingText) {
                        loadingText.remove();
                    }
                    
                    // 清空现有标签
                    const existingTags = examplesContainer.querySelectorAll('.slang-example-tag');
                    existingTags.forEach(tag => tag.remove());
                    
                    // 添加新的热门词语标签
                    data.hotSlangs.forEach(word => {
                        const tag = document.createElement('span');
                        tag.className = 'slang-example-tag';
                        tag.textContent = word;
                        tag.dataset.word = word;
                        tag.addEventListener('click', () => {
                            slangInput.value = word;
                            explainSlang();
                        });
                        examplesContainer.appendChild(tag);
                    });
                    
                    // 显示成功提示
                    showError('热门词语已刷新');
                    setTimeout(() => hideError(), 2000);
                } else {
                    showError('刷新失败，请重试');
                }
            } catch (err) {
                console.error('刷新热门词语失败:', err);
                showError('刷新失败：' + err.message);
            } finally {
                slangRefreshBtn.classList.remove('loading');
                slangRefreshBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
